services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: healthcare-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    plan: free
    healthCheckPath: /api/health/live
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379/0
      - key: CELERY_BROKER_URL
        value: redis://localhost:6379/0
      - key: USE_IN_PROCESS_WORKER
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: OAUTH_ENCRYPTION_KEY
        value: x5uX0zG12D3p4J5K6L7M8N9O0P1Q2R3S4T5U6V7W8X9=
      - key: CORS_ORIGINS
        value: https://healthcare-frontend.onrender.com

  # 2. React Vite Frontend Static Site
  - type: web
    name: healthcare-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: healthcare-backend
          property: url

databases:
  # 3. Managed PostgreSQL Database
  - name: healthcare-db
    databaseName: healthcare_db
    user: postgres
    plan: free
